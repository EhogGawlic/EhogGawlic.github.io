<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>𝟥ᴅ ᴘʜʏꜱɪᴄꜱ</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/x-icon" href="favicon.ico">

</head>
<body>
    <div id="leftbar">
        <details class="section" open>
            <summary>Dynamic objects</summary>
            <button id="add-ball" type="button">Add Ball</button><br>
            <button id="add-box" type="button">Add Box</button><br>
            <div class="inp"><label for="fxchk">Fixed</label> <input type="checkbox" id="fxchk"></div>
            <div class="inp"><label for="bclr">Color</label> <input type="color" id="bclr" value="#aaaaaa"></div>
            <div class="inp"><label for="bwidi">Width</label> <input type="number" value="20" id="bwidi"></div>
            <div class="inp"><label for="bheii">Height</label> <input type="number" value="20" id="bheii"></div>
            <div class="inp"><label for="bdepi">Depth</label> <input type="number" value="20" id="bdepi"></div>
            <div class="inp"><label for="bxi">X</label> <input type="number" value="0" id="bxi"></div>
            <div class="inp"><label for="byi">Y</label> <input type="number" value="0" id="byi"></div>
            <div class="inp"><label for="bzi">Z</label> <input type="number" value="0" id="bzi"></div>
            <div class="inp"><label for="bri">Radius</label> <input type="number" value="8" id="bri"></div>
        </details>
        <details class="section" open>
            <summary>Properties</summary>
            <div class="inp"><label for="fxchk2">Fixed</label> <input type="checkbox" id="fxchk2"></div>
            <div class="inp"><label for="bxip">X</label> <input type="number" value="0" id="bxip"></div>
            <div class="inp"><label for="byip">Y</label> <input type="number" value="0" id="byip"></div>
            <div class="inp"><label for="bzip">Z</label> <input type="number" value="0" id="bzip"></div>
            <div class="inp"><label for="brp">Radius</label> <input type="number" value="0" id="brp"></div>
            <div class="inp"><label for="bclr2">Color</label> <input type="color" id="bclr2"></div>
            <div class="inp"><label for="bmp">Mass</label> <input type="number" value="0" id="bmp"></div>
        </details>
        <details class="section">
            <summary>Add other</summary>
            <div class="inp"><label  for="aothersel">Type</label><select id="aothersel">
                <option value="fan">Fan</option>
                <option value="tcan">Trash can</option>
            </select></div>

            <div id="fanutils">
                <div class="inp"><label for="fspd">Speed</label> <input type="number" value="100" id="fspd" step="any"></div>
                <div class="inp"><label for="frad">Radius</label> <input type="number" value="20" id="frad" min="0.01" step="any"></div>
                <div class="inp" title="How much the cone of air tapers, in radians."><label for="ftap">Taper</label> <input type="number" value="0.05" id="ftap" min="-1.57" max="1.57" step="0.01"></div>
            </div>

            <div id="tcanutils" class="hidden">
                <div class="inp"><label for="tcanSize">Size</label> <input type="number" value="20" id="tcanSize" min="0.01" step="any"></div>
            </div>
            <p id="fanstatus" aria-live="polite"></p>
            <button id="fanaddok" type="button">Place fan</button>
        </details>
        <details class="section">
            <summary>Joints</summary>
            <details class="section2">
                <summary>Attachments</summary>
                <button id="addatt">Add attachment to current</button>
            </details>
            <details class="section2">
                <summary>Joint</summary>
                <div class="inp"><label>Object 1</label><button class="objpick" data-obj-type="none" data-obj-ind="0">Click to select</button></div>
                <button id="addatt">Create joint</button>
            </details>
        </details>
    </div>
    <div id="toolmenutop">
        <button class="tool" id="pauplaybtn"><img src="./pplay.svg"></button>
        <button class="tool" id="cbalsbtn"><img src="./cballs.svg"></button>
        <button class="tool" data-popup-target="popup"><img src="./resize.svg"></button>
        <button class="tool" id="clearbtn"><img src="./delscene.svg"></button>
    </div>
    <div id="toolmenuright">
        <button class="tool" id="modetrans"><img src="./transform.png" class="active"></button>
        <button class="tool" id="moderot"><img src="./rotate.png"></button>
        <button class="tool" id="modescale"><img src="./scale.png"></button>
        <button class="tool" id="delbtn"><img src="./del.png"></button>
        <button class="tool" id="wbtn"><img src="./weld.png"></button>

    </div>
    <div id="topdiv">
        <b>Physics</b>
        <div id="topmenu">

            <div class="menuitem">
                <span class="itemtrig">File</span>
                <ul class="dropdown">
                    <li>
                        <button id="exportbtn" data-popup-target="download">Export</button>
                    </li>
                    <li>
                        <button id="importbtn" data-popup-target="import">Import</button>
                    </li>
                    <li>
                        <button data-popup-target="settings">Preferences</button>
                    </li>
                </ul>
            </div>

            <div class="menuitem">
                <span class="itemtrig">Select</span>
                <ul class="dropdown">
                    <li>
                        <button id="exportbtn" data-popup-target="selectByClr">By color</button>
                    </li>
                    <li>
                        <button id="importbtn" data-popup-target="selectByRad">By radius</button>
                    </li>
                </ul>
            </div>

        </div>
    </div>
    <div id="bottomthing">
        <p id="info">Info</p>
    </div>
    <div id="popup" class="popup">
        <div class="popupHead"><span>Resize boundaries</span><button class="popupClose" type="button" aria-label="Close popup">&times;</button></div>
        <div class="popupContent">
            <div class="inp"><label for="wwid">Width</label> <input type="number" value="400" id="wwid"></div>
            <div class="inp"><label for="whei">Height</label> <input type="number" value="400" id="whei"></div>
            <div class="inp"><label for="wdep">Depth</label> <input type="number" value="400" id="wdep"></div>
            <button id="rszbtn">Resize</button>
        </div>
    </div>
    <div class="popup" id="download">
        <div class="popupHead"><span>Export</span><button class="popupClose" type="button" aria-label="Close popup">&times;</button></div>
        <div class="popupContent">
            <p><img src="info.svg" class="infoimg1">Name MUST end in ".ps3" otherwise it will not be accepted.</p>
            <div class="inp"><label for="fnam">Name</label> <input type="text" value="save.ps3" id="fnam"></div>
            <button id="dnldbtn">Export</button>
        </div>
    </div>
    <div class="popup" id="import">
        <div class="popupHead"><span>Import</span><button class="popupClose" type="button" aria-label="Close popup">&times;</button></div>
        <div class="popupContent">
            <div class="inp"><label for="fimport">File</label> <label for="fimport" class="fimportlbl">Choose/drag a file</label><input type="file" id="fimport" accept=".ps3"></div>
            <button id="impbtn">Import</button>
        </div>
    </div>
    <div class="popup" id="selectByClr">
        <div class="popupHead">Select by color<button class="popupClose" type="button" aria-label="Close popup">&times;</button></div>
        <div class="popupContent">
            <div class="inp"><label for="bclrs">Color</label> <input type="color" id="bclrs" value="#aaaaaa"></div>
            <button onclick='$("bclrs").value=$("bclr").value;wantedColor = $("bclrs").value'>Select adding color</button><br>
            <button onclick='$("bclrs").value=$("bclr2").value;wantedColor = $("bclrs").value'>Select current object color</button><br>
            <button id="selclrbtn">Select <span id="selclramt">?</span> items</button>
        </div>
    </div>
    <div class="popup" id="selectByRad">
        <div class="popupHead">Select by radius<button class="popupClose" type="button" aria-label="Close popup">&times;</button></div>
        <div class="popupContent">
            <div class="inp"><label for="brads">Color</label> <input type="number" id="brads" value="8"></div>
            <button onclick='$("brads").value=$("brp").value;wantedColor = $("brads").value'>Select current object radius</button><br>
            <button id="selradbtn">Select <span id="selradamt">?</span> items</button>
        </div>
    </div>
    <div class="popup" id="settings">
        <div class="popupHead">Preferences<button class="popupClose" type="button" aria-label="Close popup">&times;</button></div>
        <div class="popupContent">
            <div class="inp"><label for="substeps">Substeps</label> <input type="number" value="8" id="substeps"></div>
            <div class="inp"><label for="bqual">Ball quality</label> <input type="number" value="16" id="bqual"></div>
            <button id="settingsok">OK</button>
        </div>
    </div>
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.185.0/build/three.webgpu.js",
                "three/webgpu": "https://cdn.jsdelivr.net/npm/three@0.185.0/build/three.webgpu.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.185.0/examples/jsm/",
                "three/tsl": "https://cdn.jsdelivr.net/npm/three@0.185.0/build/three.tsl.js"
            }
        }
    </script>
    <script src="./utils.js"></script>
    <script src="./drag.js"></script>
    <script type="module" src="main.js"></script>
</body>
</html>
