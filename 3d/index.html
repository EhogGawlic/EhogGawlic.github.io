<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>test w/ three.js</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="leftbar">
        <details class="section" open>
            <summary>Adding</summary>
            <button id="add-ball" type="button">Add Ball</button><br>
            <button id="add-box" type="button">Add Box</button><br>
            <div class="inp"><label>Fixed</label> <input type="checkbox" id="fxchk"></div>
            <div class="inp"><label>Color</label> <input type="color" id="bclr" value="#aaaaaa"></div>
            <div class="inp"><label>Width</label> <input type="number" value="20" id="bwidi"></div>
            <div class="inp"><label>Height</label> <input type="number" value="20" id="bheii"></div>
            <div class="inp"><label>Depth</label> <input type="number" value="20" id="bdepi"></div>
            <div class="inp"><label>X</label> <input type="number" value="0" id="bxi"></div>
            <div class="inp"><label>Y</label> <input type="number" value="0" id="byi"></div>
            <div class="inp"><label>Z</label> <input type="number" value="0" id="bzi"></div>
            <div class="inp"><label>Radius</label> <input type="number" value="8" id="bri"></div>
        </details>
        <details class="section">
            <summary>Tools</summary>
            <button id="clearbtn" type="button">CLEAR</button><br>
            <h4>Modes:</h4>
            <button id="modetrans">Transform</button><br>
            <button id="modescale">Scale</button><br>
            <button id="moderot">Rotate</button><br>
            <hr>
            <button id="wbtn">Weld</button>
        </details>
        <details class="section" open>
            <summary>Properties</summary>
            <div class="inp"><label>Fixed</label> <input type="checkbox" id="fxchk2"></div>
            <div class="inp"><label>X</label> <input type="number" value="0" id="bxip"></div>
            <div class="inp"><label>Y</label> <input type="number" value="0" id="byip"></div>
            <div class="inp"><label>Z</label> <input type="number" value="0" id="bzip"></div>
            <div class="inp"><label>Radius</label> <input type="number" value="0" id="brp"></div>
            <div class="inp"><label>Color</label> <input type="color" id="bclr2"></div>
            <div class="inp"><label>Mass</label> <input type="number" value="0" id="bmp"></div>
        </details>
    </div>
    <div id="toolmenutop">
        <button class="tool" id="pauplaybtn"><img src="./pp.png"></button>
        <button class="tool" id="cbalsbtn"><img src="./cb.png" onclick="clearB()"></button>
    </div>
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.185.0/build/three.webgpu.js",
                "three/webgpu": "https://cdn.jsdelivr.net/npm/three@0.185.0/build/three.webgpu.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.185.0/examples/jsm/"
            }
        }
    </script>
    <script type="module" src="main.js"></script>
</body>
</html>
